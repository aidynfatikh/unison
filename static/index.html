<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unison</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='9' fill='none' stroke='%2312a594' stroke-width='3'/><circle cx='20' cy='16' r='9' fill='none' stroke='%23e5484d' stroke-width='3'/></svg>">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1c1a; --muted: #75756f; --faint: #a9a9a2;
  --line: #e7e6e1; --hover: #f1f0ec; --red: #d93d42; --amber: #c27c0e; --accent: #1c1c1a;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --panel: #191918; --ink: #ededea; --muted: #8f8f88; --faint: #5c5c57;
    --line: #2a2a28; --hover: #222220; --red: #ff6369; --amber: #f1a10d; --accent: #ededea;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --panel: #191918; --ink: #ededea; --muted: #8f8f88; --faint: #5c5c57;
  --line: #2a2a28; --hover: #222220; --red: #ff6369; --amber: #f1a10d; --accent: #ededea;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 22px 24px 60px; }

/* header */
header { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -0.02em; }
.brand span { color: var(--faint); font-weight: 400; }
.today { color: var(--muted); }
.spacer { flex: 1; }
.meta { color: var(--faint); font-size: 12px; font-family: var(--mono); }
.iconbtn { color: var(--muted); font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; }
.iconbtn:hover { background: var(--hover); color: var(--ink); }

/* command bar */
.term { position: relative; display: flex; align-items: center; gap: 10px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
.term:focus-within { border-color: var(--muted); }
.term .prompt { font-family: var(--mono); color: var(--faint); font-size: 15px; }
.term:focus-within .prompt { color: var(--ink); }
.field { position: relative; flex: 1; min-width: 0; font: 14.5px/1.4 var(--mono); }
.field input, .field .hl { font: inherit; letter-spacing: 0; padding: 0; margin: 0; border: 0; white-space: pre; width: 100%; }
.field input { position: relative; z-index: 1; background: none; outline: 0; color: transparent; caret-color: var(--ink); }
.field input::placeholder { color: var(--faint); }
.field input::selection { background: color-mix(in srgb, var(--muted) 35%, transparent); color: transparent; }
.field .hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
.hl .t-bucket { font-weight: 600; }
.hl .t-due { color: var(--amber); }
.hl .t-pin { color: var(--amber); font-weight: 700; }
.hl .t-cmd { color: var(--muted); font-weight: 600; }
.hl .t-bad { text-decoration: underline wavy var(--red); text-underline-offset: 3px; }
.hl .ghost { color: var(--faint); }
.term .hint { color: var(--faint); font-size: 11.5px; font-family: var(--mono); white-space: nowrap; }
.term .hint kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.suggest { position: absolute; left: 34px; top: calc(100% + 4px); z-index: 20; min-width: 300px; max-width: 520px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
  box-shadow: 0 8px 28px rgba(0,0,0,.18); font-family: var(--mono); font-size: 13px; }
.suggest:empty { display: none; }
.sug { display: flex; gap: 10px; align-items: center; padding: 5px 9px; border-radius: 5px; cursor: pointer; }
.sug.sel { background: var(--hover); }
.sug .lab { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sug .sub { color: var(--faint); font-size: 12px; white-space: nowrap; }
.sug .dot { width: 7px; height: 7px; }
.term-under { display: flex; gap: 14px; align-items: center; min-height: 26px; padding: 4px 16px 10px 38px;
  font: 12px var(--mono); color: var(--muted); }
.term-under .parsed { display: flex; gap: 12px; }
.term-under .ok { color: var(--ink); }
.term-under .err { color: var(--red); }

/* tabs */
.tabs { display: flex; gap: 4px; margin: 4px 0 16px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 8px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .n { font: 11px var(--mono); color: var(--faint); margin-left: 5px; }
.tabs .kbd { margin-left: auto; align-self: center; font: 11px var(--mono); color: var(--faint); }
.view { display: none; }
.view.on { display: block; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.empty { color: var(--faint); font-size: 12px; padding: 8px 2px; }

/* board: pinboard */
.pinboard { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 26px 20px 20px; margin-bottom: 22px;
  background-color: var(--panel);
  background-image: radial-gradient(color-mix(in srgb, var(--faint) 45%, transparent) 1px, transparent 1px);
  background-size: 16px 16px; }
.pinboard .label { position: absolute; top: 8px; left: 14px; font: 11px var(--mono); color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px 16px; padding-top: 6px; }
.note { --tint: color-mix(in srgb, var(--c) 10%, var(--panel)); position: relative; background: var(--tint);
  border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line)); border-radius: 8px; padding: 16px 14px 10px;
  min-height: 112px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 10px 18px -12px rgba(0,0,0,.45); cursor: grab; }
.note::before { content: ''; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 60%);
  box-shadow: 0 2px 3px rgba(0,0,0,.35); }
.note .title { font-size: 14.5px; font-weight: 500; line-height: 1.4; word-wrap: break-word; outline: 0; }
.note .foot { margin-top: auto; display: flex; align-items: center; gap: 8px; min-height: 22px; }
.note .bk { font: 11px var(--mono); color: var(--c); }
.pin-empty { color: var(--faint); font-size: 12.5px; padding: 6px 0 2px; }

/* board: lanes */
.lanes { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px; align-items: stretch; }
@media (max-width: 1100px) { .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .lanes { grid-template-columns: 1fr; } .wrap { padding: 16px; } .term .hint { display: none; } }
.lane { background: color-mix(in srgb, var(--panel) 55%, transparent); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 10px 10px; min-height: 260px; display: flex; flex-direction: column; gap: 8px; }
.lane-h { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; border-bottom: 2px solid var(--c); margin-bottom: 2px; }
.lane-h .name { font-weight: 600; }
.lane-h .count { color: var(--faint); font: 12px var(--mono); }
.lane-h .plus { margin-left: auto; color: var(--faint); font-size: 18px; line-height: 1; padding: 0 5px; border-radius: 4px; }
.lane-h .plus:hover { color: var(--ink); background: var(--hover); }
.lane .empty { text-align: center; padding: 22px 0; }
.drop-over { outline: 2px dashed var(--c, var(--muted)); outline-offset: -4px; }
.pinboard.drop-over { outline-color: var(--muted); }
.dragging { opacity: .35; }

/* task cards */
.task { display: flex; align-items: flex-start; gap: 9px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px; position: relative; cursor: grab; }
.task:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.task.doing { border-left: 3px solid var(--c); padding-left: 8px; }
.check { width: 15px; height: 15px; border: 1.5px solid var(--faint); border-radius: 4px; flex: none; margin-top: 2px; }
.check:hover { border-color: var(--c); }
.task.doing .check, .note.doing .check { border-color: var(--c); background: linear-gradient(90deg, var(--c) 50%, transparent 50%); }
.task.done .check { background: var(--c); border-color: var(--c); }
.task.done { opacity: .6; }
.task.done .title { text-decoration: line-through; }
.task .body { flex: 1; min-width: 0; }
.task .title { word-wrap: break-word; outline: 0; line-height: 1.4; }
[contenteditable="true"] { background: var(--bg); border-radius: 3px; padding: 0 3px; cursor: text; }
.chips { display: flex; gap: 8px; margin-top: 3px; }
.chips:empty { display: none; }
.chip { font-size: 11px; font-family: var(--mono); color: var(--muted); }
.chip.over { color: var(--red); font-weight: 600; outline: 0; }
.chip.soon { color: var(--amber); font-weight: 600; }
.chip.doing { color: var(--c); }
.actions { display: flex; gap: 1px; flex: none; opacity: 0; transition: opacity .1s; }
.task:hover .actions, .note:hover .actions { opacity: 1; }
.note .actions { margin-left: auto; }
.task .actions { position: absolute; top: 5px; right: 5px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px; box-shadow: 0 4px 10px rgba(0,0,0,.15); pointer-events: none; }
.task:hover .actions { pointer-events: auto; }
.actions button { font-size: 12px; color: var(--faint); padding: 1px 4px; border-radius: 4px; }
.actions button:hover { color: var(--ink); background: var(--hover); }
.date-in { font-size: 11px; font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 0 4px; }
.done-toggle { font-size: 12px; color: var(--faint); padding: 4px; margin-top: auto; text-align: left; }
.done-toggle:hover { color: var(--ink); }
.col-add { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); outline: 0; font-size: 13px; }

/* activity: bucket stats */
.stats { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
.stat.on { border-color: var(--c); }
.stat-h { display: flex; align-items: center; gap: 8px; height: 20px; }
.stat-h .name { font-weight: 600; }
.stat-h .ago { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
.stat-h .ago.idle { color: var(--amber); }
.nums { display: flex; align-items: baseline; gap: 14px; margin: 10px 0 12px; height: 30px; white-space: nowrap; }
.nums .big { font: 600 24px/1 var(--mono); letter-spacing: -.02em; }
.nums .small { font: 12px var(--mono); color: var(--muted); }
.spark { display: flex; gap: 3px; align-items: flex-end; height: 34px; }
.spark i { flex: 1; background: var(--c); opacity: .85; border-radius: 2px; min-height: 2px; }
.spark i.zero { background: var(--line); opacity: 1; }
.projects { font-size: 12px; line-height: 18px; color: var(--muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 0 10px; height: 47px; overflow: hidden; align-content: flex-start; }
.projects b { font-weight: 500; color: var(--ink); }

/* feed */
.feed-h { display: flex; align-items: center; gap: 12px; margin: 28px 0 10px; flex-wrap: wrap; }
.feed-h h2 { font-size: 14px; margin: 0; font-weight: 600; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.filters button.on { color: var(--ink); border-color: var(--muted); background: var(--panel); }
.day { margin-bottom: 14px; }
.day-h { font-size: 12px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
.day-h b { color: var(--ink); font-weight: 600; }
.day-h .sum { font-family: var(--mono); }
.item { display: grid; grid-template-columns: 46px 10px 150px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.item .time { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.item .dot { align-self: start; margin-top: 7px; }
.item.commit .dot { border-radius: 2px; width: 7px; height: 7px; }
.item .proj { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .what { min-width: 0; }
.item .recap { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.item .m { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 6px; }
.item.commit .what { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
.item .hash { color: var(--faint); margin-right: 6px; }
@media (max-width: 640px) { .item { grid-template-columns: 40px 10px 1fr; } .item .proj { display: none; } }
.subc { margin-top: 5px; display: flex; flex-direction: column; gap: 1px; }
.subc div { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subc .k { display: inline-block; width: 14px; color: var(--c); }
.subc .time-link .k { color: var(--faint); }
.sums { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px; margin: 10px 0 6px; }
.sum-card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px; padding: 9px 12px; position: relative; }
.sum-card h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.sum-card p { margin: 0; font-size: 12.5px; color: var(--ink); white-space: pre-wrap; line-height: 1.5; }
.sum-card .copy { margin-left: auto; font-size: 11px; color: var(--faint); font-weight: 400; }
.sum-card .copy:hover { color: var(--ink); }
.sum-btn { font-size: 11px; color: var(--faint); margin-left: auto; }
.sum-btn:hover { color: var(--ink); }
.more { color: var(--muted); font-size: 12px; margin-top: 6px; }
.more:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">unison <span>· work</span></div>
    <div class="today" id="today"></div>
    <div class="spacer"></div>
    <div class="meta" id="meta"></div>
    <button class="iconbtn" id="scanBtn" title="Rescan sessions and commits">rescan</button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme">theme</button>
  </header>

  <div class="term" id="term">
    <span class="prompt">›</span>
    <div class="field">
      <div class="hl" id="hl" aria-hidden="true"></div>
      <input id="quick" placeholder="@arqamed finish ai analysis !due today 18:00" autocomplete="off" spellcheck="false">
    </div>
    <span class="hint"><kbd>tab</kbd> complete · <kbd>/</kbd> commands</span>
    <div class="suggest" id="suggest"></div>
  </div>
  <div class="term-under" id="under"></div>

  <nav class="tabs">
    <button data-tab="board">Board<span class="n" id="nBoard"></span></button>
    <button data-tab="activity">Activity<span class="n" id="nAct"></span></button>
    <span class="kbd">1 · 2</span>
  </nav>

  <section class="view" id="view-board">
    <div class="pinboard" id="pinboard" data-drop="pinned"><span class="label">Pinned</span><div class="notes" id="notes"></div></div>
    <div class="lanes" id="lanes"></div>
  </section>

  <section class="view" id="view-activity">
    <div class="stats" id="stats"></div>
    <div class="feed-h">
      <h2>Activity</h2>
      <div class="filters" id="filters"></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="kindBtn"></button>
    </div>
    <div id="feed"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('unison.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('unison.' + k, JSON.stringify(v)); } catch {} },
};
let S = null;
let feedFilter = store.get('feedFilter', 'all');
let feedKind = store.get('feedKind', 'all');
let feedDays = 3;
let openDone = new Set();
let addingIn = null;
let tab = (location.hash.slice(1) === 'activity' || location.hash.slice(1) === 'board') ? location.hash.slice(1) : store.get('tab', 'board');
const theme = store.get('theme', null);
if (theme) document.documentElement.dataset.theme = theme;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B = id => S.buckets.find(b => b.id === id) || { id, name: id, color: '#888' };
const hrs = m => m >= 60 ? (m / 60).toFixed(1).replace(/\.0$/, '') + 'h' : Math.round(m) + 'm';
const localISO = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const dayDiff = iso => Math.round((new Date(iso + 'T00:00') - new Date(S.today + 'T00:00')) / 86400000);
function ago(ts) {
  if (!ts) return 'never';
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
function dueLabel(due) {
  const day = due.slice(0, 10), time = due.slice(11, 16);
  const d = dayDiff(day);
  const dt = new Date(day + 'T00:00');
  const end = new Date(day + 'T' + (time || '23:59'));
  const passed = end < new Date();
  let label, cls = '';
  if (passed) { label = d === 0 ? 'today' : d === -1 ? 'yesterday' : `${-d}d overdue`; cls = 'over'; }
  else if (d === 0) { label = 'today'; cls = 'over'; }
  else if (d === 1) { label = 'tomorrow'; cls = 'soon'; }
  else if (d < 7) { label = dt.toLocaleDateString(undefined, { weekday: 'short' }); cls = d <= 2 ? 'soon' : ''; }
  else label = dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  if (time && !(passed && d < -1)) label += ' ' + time;
  return { label, cls };
}
function dueChip(t) {
  if (!t.due) return '';
  let { label, cls } = dueLabel(t.due);
  if (t.status === 'done') cls = '';
  return `<button class="chip ${cls}" data-act="due" title="${t.due.replace('T', ' ')}">${label}</button>`;
}

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}
async function load() { S = await api('GET', `/api/state?days=${feedDays}`); render(); if (typeof renderUnder === 'function' && !quick.value) renderUnder(); }
const patch = (id, f) => api('PATCH', `/api/tasks/${id}`, f).then(load);

function sortTasks(ts) {
  return ts.slice().sort((a, b) =>
    (b.status === 'doing') - (a.status === 'doing') ||
    (a.due || '9999').localeCompare(b.due || '9999') ||
    b.pinned - a.pinned || a.id - b.id);
}

const actionsHTML = t => `<div class="actions">
      <button data-act="doing" title="toggle in progress">${t.status === 'doing' ? '❚❚' : '▶'}</button>
      ${t.due ? '' : '<button data-act="due" title="set deadline">◷</button>'}
      <button data-act="pin" title="${t.pinned ? 'unpin' : 'pin to board'}">${t.pinned ? '★' : '☆'}</button>
      <button data-act="del" title="delete">✕</button>
    </div>`;

function taskHTML(t) {
  const b = B(t.bucket);
  return `<div class="task ${t.status}" data-id="${t.id}" draggable="true" style="--c:${b.color}">
    <button class="check" data-act="check" title="click: done · shift-click: in progress"></button>
    <div class="body">
      <div class="title" data-act="edit">${esc(t.title)}</div>
      <div class="chips">${t.status === 'doing' ? '<span class="chip doing">in progress</span>' : ''}${dueChip(t)}</div>
    </div>
    ${actionsHTML(t)}
  </div>`;
}
function noteHTML(t) {
  const b = B(t.bucket);
  return `<div class="note ${t.status}" data-id="${t.id}" draggable="true" style="--c:${b.color}">
    <div class="title" data-act="edit">${esc(t.title)}</div>
    <div class="foot">
      <button class="check" data-act="check" title="click: done · shift-click: in progress"></button>
      <span class="bk">${esc(b.name)}</span>${t.status === 'doing' ? '<span class="chip doing">in progress</span>' : ''}${dueChip(t)}
      ${actionsHTML(t)}
    </div>
  </div>`;
}

function render() {
  const now = new Date();
  $('#today').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const weekMin = Object.values(S.stats).reduce((a, s) => a + s.week_min, 0);
  const weekCommits = Object.values(S.stats).reduce((a, s) => a + s.week_commits, 0);
  $('#meta').textContent = `week ${hrs(weekMin)} · ${weekCommits} commits · scanned ${ago(S.scanned_at)}`;
  const openCount = S.tasks.filter(t => t.status !== 'done').length;
  $('#nBoard').textContent = openCount || '';
  $('#nAct').textContent = hrs(weekMin);
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view-board').classList.toggle('on', tab === 'board');
  $('#view-activity').classList.toggle('on', tab === 'activity');
  renderBoard();
  renderStats();
  renderFeed();
}

function renderBoard() {
  const pinned = sortTasks(S.tasks.filter(t => t.pinned && t.status !== 'done'));
  $('#notes').innerHTML = pinned.map(noteHTML).join('') ||
    '<div class="pin-empty">Nothing pinned. Drag a task here, press ☆ on it, or add <b>*</b> when you type it.</div>';
  const lanes = $('#lanes');
  lanes.style.setProperty('--cols', S.buckets.length);
  lanes.innerHTML = S.buckets.map(b => {
    const open = sortTasks(S.tasks.filter(t => t.bucket === b.id && t.status !== 'done' && !t.pinned));
    const pinnedHere = pinned.filter(t => t.bucket === b.id).length;
    const done = S.tasks.filter(t => t.bucket === b.id && t.status === 'done').sort((x, y) => y.done_at - x.done_at);
    return `<section class="lane" style="--c:${b.color}" data-bucket="${b.id}" data-drop="${b.id}">
      <div class="lane-h"><span class="dot"></span><span class="name">${esc(b.name)}</span>
        <span class="count">${open.length || ''}${pinnedHere ? ` +${pinnedHere}★` : ''}</span>
        <button class="plus" data-act="col-add" title="add task">+</button></div>
      ${addingIn === b.id ? `<input class="col-add" data-bucket="${b.id}" placeholder="New ${esc(b.name)} task…  !due fri 18:00  *">` : ''}
      ${open.map(taskHTML).join('') || (addingIn === b.id ? '' : '<div class="empty">No open tasks</div>')}
      ${done.length ? `<button class="done-toggle" data-act="toggle-done">${openDone.has(b.id) ? '▾' : '▸'} ${done.length} done this week</button>` : ''}
      ${openDone.has(b.id) ? done.map(taskHTML).join('') : ''}
    </section>`;
  }).join('');
  if (addingIn) { const i = lanes.querySelector('.col-add'); i && i.focus(); }
}

function renderStats() {
  const el = $('#stats');
  el.style.setProperty('--cols', S.buckets.length);
  el.innerHTML = S.buckets.map(b => {
    const st = S.stats[b.id];
    const max = Math.max(30, ...st.daily.map(d => d.min));
    const idleDays = st.last ? (Date.now() / 1000 - st.last) / 86400 : 999;
    const spark = st.daily.map(d => {
      const h = d.min ? Math.max(8, d.min / max * 100) : 6;
      return `<i class="${d.min || d.commits ? '' : 'zero'}" style="height:${h}%" title="${d.day}: ${hrs(d.min)} · ${d.commits} commits"></i>`;
    }).join('');
    const projects = st.projects.map(p => `<span><b>${esc(p.project)}</b> ${p.minutes ? hrs(p.minutes) : ''}${p.commits ? ' · ' + p.commits + '⎇' : ''}</span>`).join('');
    const pct = st.week_commits ? Math.round(st.week_claude_commits / st.week_commits * 100) : null;
    return `<div class="stat ${feedFilter === b.id ? 'on' : ''}" style="--c:${b.color}" data-f="${b.id}" title="filter activity by ${esc(b.name)}">
      <div class="stat-h"><span class="dot"></span><span class="name">${esc(b.name)}</span>
        <span class="ago ${idleDays > 5 && idleDays < 999 ? 'idle' : ''}" title="last activity">${ago(st.last)}</span></div>
      <div class="nums"><span class="big">${hrs(st.week_min)}</span>
        <span class="small" title="${st.week_claude_commits} of ${st.week_commits} commits made in Claude sessions">${st.week_commits} ⎇${pct !== null ? ` · ${pct}%✦` : ''}</span></div>
      <div class="spark">${spark}</div>
      <div class="projects">${projects || '<span>no activity this week</span>'}</div>
    </div>`;
  }).join('');
}

function renderFeed() {
  $('#filters').innerHTML = [{ id: 'all', name: 'All', color: 'transparent' }, ...S.buckets].map(b =>
    `<button class="${feedFilter === b.id ? 'on' : ''}" data-f="${b.id}">${b.id !== 'all' ? `<span class="dot" style="--c:${b.color}"></span>` : ''}${esc(b.name)}</button>`).join('');
  $('#kindBtn').textContent = { all: 'sessions + commits', session: 'sessions only', commit: 'commits only' }[feedKind];

  const items = S.feed.filter(x => (feedFilter === 'all' || x.bucket === feedFilter) && (feedKind === 'all' || x.kind === feedKind));
  const days = new Map();
  for (const x of items) {
    const d = localISO(new Date(x.ts * 1000));
    if (!days.has(d)) days.set(d, []);
    days.get(d).push(x);
  }
  let html = '';
  for (const [d, xs] of days) {
    const diff = dayDiff(d);
    const label = diff === 0 ? 'Today' : diff === -1 ? 'Yesterday' : new Date(d + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
    const mins = xs.filter(x => x.kind === 'session').reduce((a, x) => a + x.minutes, 0);
    const commits = xs.reduce((a, x) => a + (x.kind === 'commit' ? 1 : (x.commits || []).length), 0);
    const sums = Object.entries((S.summaries || {})[d] || {})
      .filter(([b]) => feedFilter === 'all' || b === feedFilter)
      .sort(([a], [b]) => S.buckets.findIndex(x => x.id === a) - S.buckets.findIndex(x => x.id === b));
    const sumLabel = sums.length ? 'redo summary' : (diff === 0 ? 'summarize today' : 'summarize');
    html += `<div class="day"><div class="day-h"><b>${label}</b><span class="sum">${mins ? '~' + hrs(mins) : ''}${commits ? ' · ' + commits + ' commits' : ''}</span>
      <button class="sum-btn" data-sum="${d}" data-force="${sums.length ? 1 : 0}">✦ ${sumLabel}</button></div>`;
    if (sums.length) html += `<div class="sums">${sums.map(([b, x]) => `<div class="sum-card" style="--c:${B(b).color}">
      <h4><span class="dot"></span>${esc(B(b).name)}<button class="copy" data-copy="${esc(B(b).name + ' — ' + label + '\n' + x.text)}">copy</button></h4>
      <p>${esc(x.text)}</p></div>`).join('')}</div>`;
    for (const x of xs) {
      const b = B(x.bucket);
      const t = new Date(x.ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      if (x.kind === 'session') {
        const showPrompt = x.prompt && x.prompt !== x.title;
        html += `<div class="item session" style="--c:${b.color}"><span class="time">${t}</span><span class="dot"></span>
          <span class="proj" title="${esc(x.project)}">${esc(x.project)}</span>
          <div class="what">${esc(x.title)}<span class="m">${hrs(x.minutes)} · ${x.prompts} prompts${x.commits.length ? ` · ${x.commits.length} commit${x.commits.length > 1 ? 's' : ''}` : ''}</span>
          ${x.recap ? `<div class="recap">${esc(x.recap)}</div>` : showPrompt ? `<div class="recap">“${esc(x.prompt.slice(0, 180))}”</div>` : ''}
          ${x.commits.length ? `<div class="subc">${x.commits.map(c => `<div class="${c.link}-link" title="${c.link === 'claude' ? 'committed by this session' : 'committed while this session was open'}"><span class="k">${c.link === 'claude' ? '✦' : '◷'}</span><span class="hash">${c.id}</span>${esc(c.title)}</div>`).join('')}</div>` : ''}</div></div>`;
      } else {
        html += `<div class="item commit" style="--c:${b.color}"><span class="time">${t}</span><span class="dot"></span>
          <span class="proj" title="${esc(x.project)}">${esc(x.project)}</span>
          <div class="what"><span class="hash">${x.id}</span>${esc(x.title)}</div></div>`;
      }
    }
    html += '</div>';
  }
  html += feedDays < 30 ? `<button class="more" id="moreBtn">Show ${feedDays < 7 ? 'week' : 'month'} →</button>` : '';
  $('#feed').innerHTML = html || '<div class="empty">No activity in this range.</div>';
  const more = $('#moreBtn');
  if (more) more.onclick = () => { feedDays = feedDays < 7 ? 7 : 30; load(); };
}

// ---- command bar: @bucket  !due today 18:00  *  /commands, with tab completion
const quick = $('#quick'), hl = $('#hl'), sugEl = $('#suggest'), under = $('#under');
const WEEK = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DATE_RE = /^(today|tod|td|tomorrow|tmr|tom|tm|nextweek|nw|mon(day)?|tue(sday)?|wed(nesday)?|thu(rsday)?|fri(day)?|sat(urday)?|sun(day)?|\+\d+[dw]?|\d{4}-\d{2}-\d{2}|\d{1,2}[./]\d{1,2}([./]\d{2,4})?|\d{1,2}[a-z]{3}[a-z]*|[a-z]{3}[a-z]*\d{1,2})$/i;
const TIME_RE = /^(\d{1,2}(:\d{2})?(am|pm|h)|\d{1,2}:\d{2})$/i;
const isDate = w => DATE_RE.test(w) || (w.includes('@') && DATE_RE.test(w.split('@')[0]) && TIME_RE.test(w.split('@')[1]));
const COMMANDS = [
  { name: 'done', args: '<task>', desc: 'mark done' },
  { name: 'doing', args: '<task>', desc: 'mark in progress' },
  { name: 'todo', args: '<task>', desc: 'back to todo' },
  { name: 'pin', args: '<task>', desc: 'pin / unpin' },
  { name: 'due', args: '<task> <when>', desc: 'set or clear deadline' },
  { name: 'rm', args: '<task>', desc: 'delete task' },
  { name: 'summary', args: '[day]', desc: 'write the daily summary' },
  { name: 'scan', args: '', desc: 'rescan sessions + commits' },
  { name: 'help', args: '', desc: 'syntax cheat sheet' },
];
const TASK_CMDS = ['done', 'doing', 'todo', 'pin', 'due', 'rm'];
let sug = { items: [] }, sel = 0, navigated = false, dismissed = false;
let history = store.get('history', []), hIdx = -1, msg = null, parseTimer = null;

function addDays(n) { const d = new Date(S.today + 'T00:00'); d.setDate(d.getDate() + n); return d; }
function wordDate(w) {
  w = w.toLowerCase();
  if (['today', 'tod', 'td'].includes(w)) return addDays(0);
  if (['tomorrow', 'tmr', 'tom', 'tm'].includes(w)) return addDays(1);
  if (w === 'nextweek') { const d = addDays(0); return addDays((8 - d.getDay()) % 7 || 7); }
  const i = WEEK.indexOf(w.slice(0, 3));
  if (i >= 0) { const cur = (addDays(0).getDay() + 6) % 7; return addDays((i - cur + 7) % 7); }
  const m = w.match(/^\+(\d+)([dw]?)$/);
  if (m) return addDays(+m[1] * (m[2] === 'w' ? 7 : 1));
  return null;
}
const fmtD = d => d ? d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) : '';

function dateItems(q, pre) {
  const words = ['today', 'tomorrow', ...WEEK, 'nextweek', '+3d', '+1w'];
  let out = words.filter(w => w.startsWith(q.toLowerCase())).map(w => ({ insert: pre + w, label: pre + w, sub: fmtD(wordDate(w)) }));
  if (/^\d/.test(q)) out = [...timeItems(q, pre, 'today at '), ...out];
  return out;
}
function timeItems(q, pre = '', subPre = '') {
  return ['09:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '23:59']
    .filter(t => t.startsWith(q.padStart(q.length && q.length < 2 && !q.includes(':') && +q > 2 ? 2 : q.length, '0')) || t.replace(/^0/, '').startsWith(q))
    .map(t => ({ insert: pre + t, label: pre + t, sub: subPre ? subPre + t : 'time' }));
}
function bucketItems(q) {
  q = q.toLowerCase();
  return S.buckets.filter(b => b.id.startsWith(q) || b.name.toLowerCase().startsWith(q))
    .map(b => ({ insert: '@' + b.id, label: '@' + b.id, sub: b.name, color: b.color }));
}
function taskItems(q) {
  q = q.toLowerCase();
  return sortTasks(S.tasks.filter(t => t.status !== 'done'))
    .filter(t => !q || String(t.id).startsWith(q) || t.title.toLowerCase().includes(q))
    .map(t => ({ insert: String(t.id), label: t.title, sub: `#${t.id} · ${B(t.bucket).name}`, color: B(t.bucket).color }));
}

function context() {
  const v = quick.value, caret = quick.selectionStart ?? v.length;
  const before = v.slice(0, caret);
  const tok = before.match(/\S*$/)[0], tokStart = caret - tok.length;
  let tokEnd = caret; while (tokEnd < v.length && !/\s/.test(v[tokEnd])) tokEnd++;
  const prev = before.slice(0, tokStart).trim().split(/\s+/).filter(Boolean);
  return { v, caret, tok, tokStart, tokEnd, prev };
}
function computeSuggestions() {
  const c = context(), t = c.tok, lt = t.toLowerCase(), prev = c.prev;
  const p1 = (prev[prev.length - 1] || '').toLowerCase(), p2 = (prev[prev.length - 2] || '').toLowerCase();
  let items = [];
  const inCmd = prev.length ? prev[0].startsWith('/') : t.startsWith('/');
  if (inCmd) {
    const cmd = prev.length ? prev[0].slice(1).toLowerCase() : null;
    if (!prev.length) items = COMMANDS.filter(x => x.name.startsWith(lt.slice(1))).map(x => ({ insert: '/' + x.name, label: `/${x.name} ${x.args}`, sub: x.desc }));
    else if (TASK_CMDS.includes(cmd) && prev.length === 1) items = taskItems(t);
    else if (cmd === 'due' && prev.length === 2) items = [{ insert: 'none', label: 'none', sub: 'clear deadline' }, ...dateItems(t, '')].filter(x => x.insert.startsWith(lt));
    else if (cmd === 'due' && prev.length === 3 && isDate(p1) && (!t || /^\d/.test(t))) items = timeItems(t);
    else if (cmd === 'summary' && prev.length === 1) items = ['today', 'yesterday', ...WEEK].filter(w => w.startsWith(lt)).map(w => ({ insert: w, label: w, sub: 'summarize' }));
  } else if (/^[@#]/.test(t)) items = bucketItems(t.slice(1));
  else if (t.startsWith('!')) {
    items = dateItems(t.slice(1), '!');
    if ('due'.startsWith(lt.slice(1))) items.unshift({ insert: '!due', label: '!due', sub: 'deadline: date then time' });
    if ('pin'.startsWith(lt.slice(1)) && t.length > 1) items.push({ insert: '*', label: '*', sub: 'pin' });
  }
  else if (p1 === '!due') items = dateItems(t, '');
  else if (((p1.startsWith('!') && isDate(p1.slice(1)) && !p1.includes('@')) || (p2 === '!due' && isDate(p1))) && (!t || /^\d/.test(t))) items = timeItems(t);
  sug = { ...c, items: items.slice(0, 8) };
  if (sel >= sug.items.length) sel = 0;
}
function accept(item) {
  const { v, tokStart, tokEnd } = sug;
  const after = v.slice(tokEnd).replace(/^\s*/, '');
  quick.value = v.slice(0, tokStart) + item.insert + ' ' + after;
  const pos = tokStart + item.insert.length + 1;
  quick.setSelectionRange(pos, pos);
  sel = 0; navigated = false; dismissed = false;
  refresh();
}

function highlight() {
  const v = quick.value;
  const parts = v.split(/(\s+)/);
  const words = [];
  let html = '', first = true;
  for (const p of parts) {
    if (!p) continue;
    if (/^\s+$/.test(p)) { html += p; continue; }
    const lw = p.toLowerCase(), w1 = (words[words.length - 1] || '').toLowerCase(), w2 = (words[words.length - 2] || '').toLowerCase();
    let cls = '', style = '';
    if (first && p.startsWith('/')) cls = 't-cmd';
    else if (/^[@#]./.test(p)) {
      const q = lw.slice(1);
      const hits = S ? S.buckets.filter(b => b.id.startsWith(q) || b.name.toLowerCase().startsWith(q)) : [];
      if (hits.length === 1) { cls = 't-bucket'; style = `color:${hits[0].color}`; } else cls = 't-bad';
    }
    else if (p === '*') cls = 't-pin';
    else if (lw === '!due' || (lw.startsWith('!') && (isDate(lw.slice(1)) || TIME_RE.test(lw.slice(1))))) cls = 't-due';
    else if (w1 === '!due' && isDate(lw)) cls = 't-due';
    else if (TIME_RE.test(lw) && ((w1.startsWith('!') && isDate(w1.slice(1))) || (w2 === '!due' && isDate(w1)))) cls = 't-due';
    html += cls ? `<span class="${cls}" style="${style}">${esc(p)}</span>` : esc(p);
    words.push(p); first = false;
  }
  const top = sug.items[sel];
  const atEnd = quick.selectionStart === v.length;
  if (top && atEnd && !dismissed && sug.tok && top.insert.toLowerCase().startsWith(sug.tok.toLowerCase()) && top.insert.length > sug.tok.length)
    html += `<span class="ghost">${esc(top.insert.slice(sug.tok.length))}</span>`;
  hl.innerHTML = html;
  hl.scrollLeft = quick.scrollLeft;
}
function renderSuggest() {
  if (dismissed || !sug.items.length || document.activeElement !== quick) { sugEl.innerHTML = ''; return; }
  sugEl.innerHTML = sug.items.map((it, i) => `<div class="sug ${i === sel ? 'sel' : ''}" data-i="${i}">
    ${it.color ? `<span class="dot" style="--c:${it.color}"></span>` : ''}<span class="lab">${esc(it.label)}</span><span class="sub">${esc(it.sub || '')}</span></div>`).join('');
}
function renderUnder() {
  if (msg) { under.innerHTML = `<span class="${msg.err ? 'err' : 'ok'}">${esc(msg.text)}</span>`; return; }
  const v = quick.value.trim();
  if (!v) { under.innerHTML = '<span>@bucket · !due today 18:00 · !fri@14:00 · !+3d · * pin · /done 12 · ↑ history</span>'; return; }
  if (v.startsWith('/')) {
    const c = COMMANDS.find(x => x.name === v.slice(1).split(/\s+/)[0].toLowerCase());
    under.innerHTML = c ? `<span>/${c.name} ${esc(c.args)} — ${esc(c.desc)}</span>` : '<span>command</span>';
    return;
  }
  clearTimeout(parseTimer);
  parseTimer = setTimeout(async () => {
    const r = await api('GET', `/api/parse?text=${encodeURIComponent(v)}`);
    if (quick.value.trim() !== v || msg) return;
    const b = B(r.bucket);
    under.innerHTML = `<span class="parsed"><span style="color:${b.color}">● ${esc(b.name)}</span>${r.due ? `<span style="color:var(--amber)">◷ ${esc(dueLabel(r.due).label)} · ${esc(fmtD(new Date(r.due.slice(0, 10) + 'T00:00')))}</span>` : ''}${r.pinned ? '<span>★ pinned</span>' : ''}<span>${esc(r.title || '…')}</span></span><span style="margin-left:auto">↵ add</span>`;
  }, 90);
}
function refresh() { computeSuggestions(); highlight(); renderSuggest(); renderUnder(); }
function say(text, err = false) { msg = { text, err }; renderUnder(); }

async function submit() {
  const v = quick.value.trim();
  if (!v) return;
  history = [v, ...history.filter(h => h !== v)].slice(0, 50); store.set('history', history); hIdx = -1;
  if (v.startsWith('/')) return runCommand(v);
  const r = await api('POST', '/api/tasks', { text: v });
  if (r.error) return say(r.error, true);
  quick.value = '';
  say(`✓ added "${r.title}" → ${B(r.bucket).name}${r.due ? ' · ' + dueLabel(r.due).label : ''}${r.pinned ? ' · pinned' : ''}`);
  await load(); refresh();
}
function dayFromWord(w) {
  w = (w || 'today').toLowerCase();
  if (w === 'yesterday' || w === 'yd') return localISO(addDays(-1));
  const d = wordDate(w);
  if (d && WEEK.includes(w.slice(0, 3)) && d > addDays(0)) d.setDate(d.getDate() - 7);
  return d ? localISO(d) : w;
}
async function runCommand(v) {
  const [raw, ...args] = v.slice(1).split(/\s+/);
  const cmd = raw.toLowerCase();
  if (TASK_CMDS.includes(cmd)) {
    const t = S.tasks.find(x => x.id === +args[0]);
    if (!t) return say(`no task "${args[0] || ''}" — pick one with tab`, true);
    let r;
    if (cmd === 'rm') r = await api('DELETE', `/api/tasks/${t.id}`);
    else if (cmd === 'pin') r = await api('PATCH', `/api/tasks/${t.id}`, { pinned: !t.pinned });
    else if (cmd === 'due') { const w = args.slice(1).join(' '); r = await api('PATCH', `/api/tasks/${t.id}`, { due_text: w === 'none' ? '' : w }); }
    else r = await api('PATCH', `/api/tasks/${t.id}`, { status: cmd });
    if (r.error) return say(r.error, true);
    say(`✓ ${cmd === 'pin' ? (t.pinned ? 'unpinned' : 'pinned') : cmd} · ${t.title}`);
  } else if (cmd === 'summary') {
    const day = dayFromWord(args[0]);
    say(`✦ summarizing ${day}…`);
    await api('POST', '/api/summarize', { day, force: true });
    say(`✓ summary for ${day} is in the activity feed`);
  } else if (cmd === 'scan') {
    say('scanning…'); const r = await api('POST', '/api/scan');
    say(`✓ scanned: ${r.sessions} sessions updated, ${r.commits} new commits`);
  } else if (cmd === 'help') {
    say('@bucket  !due today 18:00  !fri@14:00  !18:00  !+3d  !30.10  *pin   |   /done /doing /todo /pin /due /rm <task>  /summary [day]  /scan');
    quick.value = ''; return refresh();
  } else return say(`unknown command /${raw} — type / to see them`, true);
  quick.value = '';
  await load(); refresh();
}

quick.addEventListener('input', () => { msg = null; dismissed = false; navigated = false; sel = 0; hIdx = -1; refresh(); });
quick.addEventListener('focus', refresh);
quick.addEventListener('blur', () => setTimeout(() => { sugEl.innerHTML = ''; highlight(); }, 120));
quick.addEventListener('scroll', () => { hl.scrollLeft = quick.scrollLeft; });
quick.addEventListener('click', refresh);
quick.addEventListener('keyup', e => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) refresh(); });
quick.addEventListener('keydown', e => {
  const open = !dismissed && sug.items.length > 0;
  if (e.key === 'Tab') {
    e.preventDefault();
    if (open) accept(sug.items[sel]);
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    if (open) { sel = (sel + dir + sug.items.length) % sug.items.length; navigated = true; highlight(); return renderSuggest(); }
    if (!history.length) return;
    hIdx = Math.max(-1, Math.min(history.length - 1, hIdx + (dir < 0 ? 1 : -1)));
    quick.value = hIdx < 0 ? '' : history[hIdx];
    quick.setSelectionRange(quick.value.length, quick.value.length);
    msg = null; dismissed = true; highlight(); renderSuggest(); renderUnder();
    return;
  }
  if (e.key === 'ArrowRight' && open && quick.selectionStart === quick.value.length && hl.querySelector('.ghost')) {
    e.preventDefault(); return accept(sug.items[sel]);
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (open && navigated) return accept(sug.items[sel]);
    return submit();
  }
  if (e.key === 'Escape') {
    if (open) { dismissed = true; renderSuggest(); highlight(); }
    else if (quick.value) { quick.value = ''; msg = null; refresh(); }
    else quick.blur();
  }
});
sugEl.addEventListener('mousedown', e => {
  const el = e.target.closest('.sug');
  if (el) { e.preventDefault(); sel = +el.dataset.i; accept(sug.items[sel]); }
});
document.addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (!typing && (e.key === '/' || e.key === 'n'))) {
    e.preventDefault(); quick.focus();
    if (e.key === '/' && !quick.value) { quick.value = '/'; refresh(); }
  }
});


// ---- task interactions (event delegation)
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  const f = e.target.closest('[data-f]');
  if (f) { feedFilter = feedFilter === f.dataset.f && f.dataset.f !== 'all' ? 'all' : f.dataset.f; store.set('feedFilter', feedFilter); renderStats(); return renderFeed(); }
  const sb = e.target.closest('[data-sum]');
  if (sb) {
    sb.textContent = '✦ summarizing…'; sb.disabled = true;
    await api('POST', '/api/summarize', { day: sb.dataset.sum, force: sb.dataset.force === '1' });
    return load();
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = 'copied'; } catch {} return; }
  if (!el) return;
  const act = el.dataset.act;
  const col = el.closest('.col');
  if (act === 'col-add') { addingIn = addingIn === col.dataset.bucket ? null : col.dataset.bucket; return render(); }
  if (act === 'toggle-done') { const b = col.dataset.bucket; openDone.has(b) ? openDone.delete(b) : openDone.add(b); return render(); }
  const taskEl = el.closest('.task');
  if (!taskEl) return;
  const id = +taskEl.dataset.id;
  const t = S.tasks.find(x => x.id === id);
  if (act === 'check') return patch(id, { status: e.shiftKey ? (t.status === 'doing' ? 'todo' : 'doing') : (t.status === 'done' ? 'todo' : 'done') });
  if (act === 'doing') return patch(id, { status: t.status === 'doing' ? 'todo' : 'doing' });
  if (act === 'pin') return patch(id, { pinned: !t.pinned });
  if (act === 'del') { await api('DELETE', `/api/tasks/${id}`); return load(); }
  if (act === 'due') {
    const inp = document.createElement('input');
    const timed = t.due && t.due.length > 10;
    inp.type = timed ? 'datetime-local' : 'date'; inp.className = 'date-in'; inp.value = t.due ? (timed ? t.due.slice(0, 16) : t.due) : '';
    el.replaceWith(inp); inp.focus(); try { inp.showPicker(); } catch {}
    inp.addEventListener('change', () => patch(id, { due: inp.value || null }));
    inp.addEventListener('blur', () => setTimeout(load, 150));
    inp.addEventListener('keydown', ev => { if (ev.key === 'Escape') load(); if (ev.key === 'Delete' || ev.key === 'Backspace' && !inp.value) patch(id, { due: null }); });
  }
});
document.addEventListener('dblclick', e => {
  const title = e.target.closest('[data-act="edit"]');
  if (!title) return;
  const id = +title.closest('.task').dataset.id;
  title.contentEditable = 'true'; title.focus();
  document.getSelection().selectAllChildren(title);
  const finish = save => {
    title.contentEditable = 'false';
    const v = title.textContent.trim();
    if (save && v) patch(id, { title: v }); else load();
  };
  title.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); finish(true); } if (ev.key === 'Escape') finish(false); };
  title.onblur = () => finish(true);
});
document.addEventListener('keydown', async e => {
  if (!e.target.classList.contains('col-add')) return;
  if (e.key === 'Escape') { addingIn = null; return render(); }
  if (e.key === 'Enter' && e.target.value.trim()) {
    await api('POST', '/api/tasks', { text: e.target.value, bucket: e.target.dataset.bucket });
    load();
  }
});

function setTab(t) { tab = t; store.set('tab', t); window.history.replaceState(null, '', '#' + t); render(); }
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if (!typing && !e.ctrlKey && !e.metaKey && (e.key === '1' || e.key === '2')) setTab(e.key === '1' ? 'board' : 'activity');
});

// drag a task: onto a lane = move bucket (and unpin), onto the pinboard = pin
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('[data-id]');
  if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => c.classList.add('dragging'), 0);
});
document.addEventListener('dragend', () => document.querySelectorAll('.dragging, .drop-over').forEach(x => x.classList.remove('dragging', 'drop-over')));
document.addEventListener('dragover', e => {
  const z = e.target.closest?.('[data-drop]');
  if (!z) return;
  e.preventDefault();
  document.querySelectorAll('.drop-over').forEach(x => x !== z && x.classList.remove('drop-over'));
  z.classList.add('drop-over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest?.('[data-drop]');
  if (!z) return;
  e.preventDefault();
  z.classList.remove('drop-over');
  const id = +e.dataTransfer.getData('text/plain');
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const f = {};
  if (z.dataset.drop === 'pinned') { if (!t.pinned) f.pinned = true; }
  else { if (t.bucket !== z.dataset.drop) f.bucket = z.dataset.drop; if (t.pinned) f.pinned = false; }
  Object.keys(f).length ? patch(id, f) : load();
});

$('#kindBtn').onclick = () => { feedKind = { all: 'session', session: 'commit', commit: 'all' }[feedKind]; store.set('feedKind', feedKind); renderFeed(); };
$('#scanBtn').onclick = async () => { $('#scanBtn').textContent = 'scanning…'; await api('POST', '/api/scan'); $('#scanBtn').textContent = 'rescan'; load(); };
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next);
};

load();
setInterval(() => { if (!document.hidden && !document.activeElement.isContentEditable && document.activeElement.tagName !== 'INPUT') load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
