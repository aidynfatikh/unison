# http://unison -> local Unison service. Only reachable from this machine.
server {
    listen 80;
    listen [::]:80;
    server_name unison unison.local;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:7477;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
